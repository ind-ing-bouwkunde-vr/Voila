<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voilà</title>
<meta name="theme-color" content="#f1f4f3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Voilà">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1ee;--card:#fffdfb;--ink:#2d2327;--muted:#8a7d82;--line:#e9e0dc;
  --accent:#9c5b6e;--accent2:#b98292;--accent-soft:#f3e6ea;
  --imp:#b88a52;--imp-soft:#f7efe3;--red:#b5475c;--red-soft:#f8e3e6;--orange:#b07a3e;--orange-soft:#f7efe3;
  --violet:#6e5d7e;--violet-soft:#eeeaf2;
  --shadow:0 1px 2px rgba(60,30,40,.05),0 6px 20px rgba(60,30,40,.06);
  --shadow-lg:0 10px 40px rgba(60,30,40,.13);
  --r:20px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#18141a;--card:#221d24;--ink:#efe8ea;--muted:#a8999f;--line:#352d36;
  --accent:#d495a8;--accent2:#9c5b6e;--accent-soft:#36242c;
  --imp:#dcb07a;--imp-soft:#352b1f;--red:#f08c9c;--red-soft:#3a2026;--orange:#dcb07a;--orange-soft:#352b1f;
  --violet:#b8a6cc;--violet-soft:#2b2533;
  --shadow:0 1px 2px rgba(0,0,0,.35);--shadow-lg:0 10px 40px rgba(0,0,0,.55);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.45}
body{background:var(--bg);background-image:radial-gradient(900px 500px at 100% -10%,color-mix(in srgb,var(--accent2) 10%,transparent),transparent 60%),radial-gradient(700px 400px at -10% 10%,color-mix(in srgb,var(--violet) 9%,transparent),transparent 60%);background-attachment:fixed;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,.ftitle,.hero h2,.weeknav b,.ring b{font-family:Fraunces,Georgia,serif}
#app{padding:env(safe-area-inset-top) 0 calc(110px + env(safe-area-inset-bottom))}
header{max-width:780px;margin:0 auto;padding:20px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{font-size:22px;margin:0;font-weight:600;font-style:italic;display:flex;align-items:center;gap:9px}
header h1 i{width:32px;height:32px;border-radius:50%;font-style:normal;background:linear-gradient(135deg,var(--accent2),var(--accent));display:grid;place-items:center;color:#fff;font-style:normal;font-size:16px;box-shadow:var(--shadow)}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);padding:5px 11px;border-radius:99px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}.dot.warn{background:var(--orange)}
main{max-width:780px;margin:0 auto;padding:0 20px}
main.wide,header.wide{max-width:1320px}
h2.big{font-size:34px;margin:14px 0 2px;font-weight:500;font-style:italic;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px}
h3{font-size:17px;color:var(--ink);margin:28px 2px 10px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h3::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
h3 .cnt{font-size:13px;color:var(--muted);font-weight:700;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:1px 9px}
h3 .mini{margin-left:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
/* hero */
.hero{margin:10px 0 18px;padding:22px 22px;border-radius:26px;color:#fff;background:var(--hero);box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-50px;top:-70px;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero>div:first-child{flex:1;min-width:0;position:relative;z-index:1}
.hdate{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;opacity:.8}
.hero h2{margin:2px 0 6px;font-size:36px;font-weight:500;line-height:1.1;font-style:italic}
.hero p{margin:0;opacity:.92;font-weight:600}
.hring{position:relative;width:92px;height:92px;flex:none;z-index:1}
.hring svg{transform:rotate(-90deg)}
.hring b{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:20px;font-weight:800;line-height:1}
.hring b small{display:block;font-size:11px;font-weight:700;opacity:.85;margin-top:3px}
/* add */
.add{display:flex;gap:8px;align-items:center;padding:7px 7px 7px 18px;border-radius:18px;transition:box-shadow .2s,border-color .2s}
.add:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),var(--shadow)}
.add input{flex:1;border:0;background:none;outline:none;padding:12px 0;font-size:18px;min-width:0}
.add .plus{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;font-size:26px;font-weight:700;flex:none;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 35%,transparent)}
.hint{font-size:13.5px;color:var(--muted);margin:8px 6px 0}
.hint b{color:var(--ink)}
.focusbtn{width:100%;margin:16px 0 4px;padding:17px;border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--violet) 80%,#000),color-mix(in srgb,var(--violet) 55%,#000));color:#fff;font-weight:800;font-size:18px;box-shadow:0 8px 22px color-mix(in srgb,var(--violet) 35%,transparent);display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s}
.focusbtn:active{transform:scale(.98)}
/* tasks */
.list{display:flex;flex-direction:column;gap:8px}
.list>.task{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.task{display:flex;align-items:center;gap:12px;padding:11px 10px 11px 14px;transition:transform .15s,opacity .2s}
.list>.task:hover{transform:translateY(-1px)}
.list>.task.imp{border-color:color-mix(in srgb,var(--imp) 45%,var(--line));background:linear-gradient(90deg,var(--imp-soft),var(--card) 75%)}
.check{width:30px;height:30px;flex:none;border-radius:50%;border:2.5px solid color-mix(in srgb,var(--muted) 60%,transparent);display:grid;place-items:center;font-weight:800;color:#fff;font-size:16px;transition:.15s}
.check:hover{border-color:var(--accent);background:var(--accent-soft)}
.task.done .check,.step.done .check{background:var(--accent);border-color:var(--accent)}
.task.done{opacity:.6}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.tbody{flex:1;min-width:0;cursor:pointer;padding:3px 0}
.ttl{font-weight:700;overflow-wrap:break-word;hyphens:auto}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chip{font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--bg);color:var(--muted);white-space:nowrap}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.orange{background:var(--orange-soft);color:var(--orange)}
.star{font-size:22px;color:color-mix(in srgb,var(--muted) 60%,transparent);width:38px;height:38px;flex:none;border-radius:12px}
.star:hover{background:var(--imp-soft);color:var(--imp)}
.task.imp .star{color:var(--imp)}
.mini{font-size:13px;font-weight:800;padding:8px 12px;border-radius:11px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.mini.grey{background:var(--bg);color:var(--muted)}
.box{padding:13px 16px;border-radius:16px;margin-top:12px}
.box.warn{background:var(--orange-soft);color:var(--orange);font-weight:700}
.empty{padding:22px 18px;text-align:center;color:var(--muted);border-style:dashed;box-shadow:none;background:color-mix(in srgb,var(--card) 60%,transparent)}
.toggle{color:var(--muted);font-weight:800;font-size:14px;padding:14px 4px 8px}
/* week */
.weeknav{display:flex;align-items:center;gap:10px;margin:8px 0 16px;flex-wrap:wrap}
.weeknav .arrow{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:22px;font-weight:800;box-shadow:var(--shadow)}
.weeknav b{font-size:22px;font-weight:500;font-style:italic;flex:1;text-align:center;min-width:180px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
@media (max-width:1150px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:780px){.grid{grid-template-columns:1fr 1fr}}
@media (max-width:540px){.grid{grid-template-columns:1fr}}
.day{display:flex;flex-direction:column;min-height:170px;overflow:hidden;--dc:var(--accent)}
.day:nth-child(1){--dc:#c99aa6}.day:nth-child(2){--dc:#a99bc0}.day:nth-child(3){--dc:#cfa98f}.day:nth-child(4){--dc:#9c5b6e}.day:nth-child(5){--dc:#93a9c0}.day:nth-child(6){--dc:#98b3a3}.day:nth-child(7){--dc:#b7a3c4}
.dayhead{padding:12px 14px 10px;display:flex;flex-wrap:wrap;gap:2px 8px;justify-content:space-between;align-items:center;border-top:5px solid var(--dc)}
.dayhead b{text-transform:capitalize;font-size:16px}
.dayhead small{color:var(--muted);font-weight:800;font-size:12.5px}
.day.today{box-shadow:0 0 0 2px var(--dc),var(--shadow-lg)}
.day.today .dayhead{background:color-mix(in srgb,var(--dc) 12%,transparent)}
.day.past{opacity:.6}
.day .task{padding:8px 8px;gap:9px;font-size:15px;margin:0 6px;border-radius:12px;align-items:flex-start}
.day .chip{white-space:normal}
.day .dayhead small{white-space:nowrap}
.day .task:hover{background:var(--bg)}
.day .check{width:24px;height:24px;font-size:13px;border-width:2px}
.day .star{display:none}
.day .task.imp .ttl::before{content:"★ ";color:var(--imp)}
.day .meta .chip{font-size:11.5px}
.dayadd{margin-top:auto;padding:6px}
.dayadd input{width:100%;border:0;background:var(--bg);border-radius:12px;padding:10px 12px;outline:none;font-size:15px}
.dayadd input:focus{box-shadow:0 0 0 2px var(--dc)}
/* forms */
textarea{width:100%;border:0;background:none;outline:none;resize:vertical;min-height:130px;padding:16px 18px;font-size:16px;line-height:1.7}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:13px 20px;border-radius:14px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;font-weight:800;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 30%,transparent)}
input[type=date]{border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--bg)}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 12px calc(12px + env(safe-area-inset-bottom));z-index:5;pointer-events:none}
nav .in{display:flex;max-width:540px;width:100%;gap:4px;padding:6px;border-radius:24px;background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:var(--shadow-lg);pointer-events:auto}
nav button{flex:1;padding:7px 2px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12.5px;font-weight:800;color:var(--muted);transition:background .2s}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
nav button.on{color:#fff;background:linear-gradient(135deg,var(--accent2),var(--accent))}
nav .badge{font-size:10.5px;background:var(--red);color:#fff;border-radius:99px;padding:0 6px;margin-left:3px}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(20,20,25,.4);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.overlay[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:var(--shadow-lg);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:26px}}
.sheet .tin{width:100%;font-size:23px;font-weight:800;border:0;border-bottom:2px solid var(--line);padding:6px 0 12px;outline:none;background:none}
.sheet .tin:focus{border-color:var(--accent)}
.sheet label{display:block;font-size:14px;font-weight:800;color:var(--muted);margin:20px 0 9px}
.chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.pick{padding:9px 14px;border-radius:12px;background:var(--bg);font-weight:700;font-size:15px;border:1px solid transparent}
.pick.on{background:var(--accent);color:#fff}
.pick.impon{background:var(--imp);color:#fff}
.step{display:flex;align-items:center;gap:10px;padding:7px 0}
.step .check{width:26px;height:26px;font-size:14px}
.step.done span{text-decoration:line-through;color:var(--muted)}
.step span{flex:1}
.step .x{color:var(--muted);font-size:20px;width:30px}
.stepadd{width:100%;border:0;border-radius:12px;padding:11px 13px;background:var(--bg);outline:none;margin-top:4px}
.sheetfoot{display:flex;justify-content:space-between;gap:10px;margin-top:26px}
.danger{color:var(--red);font-weight:800;padding:12px 6px}
/* focus */
#focus{position:fixed;inset:0;z-index:20;background:var(--bg);background-image:radial-gradient(800px 600px at 50% 0%,var(--violet-soft),transparent 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top)) 22px calc(20px + env(safe-area-inset-bottom));text-align:center;overflow:auto}
#focus[hidden]{display:none}
.fclose{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;font-size:15px;font-weight:800;color:var(--muted);padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.flabel{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--violet);background:var(--violet-soft);padding:6px 14px;border-radius:99px}
.ftitle{font-size:clamp(28px,6vw,46px);font-weight:500;margin:16px 0 20px;max-width:720px;overflow-wrap:anywhere;line-height:1.15}
.fsteps{text-align:left;max-width:440px;width:100%;margin:0 auto 16px}
.ring{position:relative;width:160px;height:160px;margin:6px auto 12px}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:32px;font-weight:800;font-family:Outfit,sans-serif}
.factions{display:flex;flex-direction:column;gap:12px;width:100%;max-width:420px;margin-top:18px}
.factions .btn{padding:18px;font-size:20px;border-radius:18px}
.fsmall{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
/* toast & confetti */
#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:16px;font-weight:800;opacity:0;transition:.25s;z-index:30;pointer-events:none;max-width:90vw;text-align:center;box-shadow:var(--shadow-lg)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.conf{position:fixed;z-index:31;pointer-events:none;width:7px;height:7px;border-radius:50%;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media (max-width:520px){.hero{padding:18px}.hero h2{font-size:28px}.hring{width:80px;height:80px}h2.big{font-size:28px}}
@media (prefers-reduced-motion:reduce){.conf{display:none}*{transition:none!important;animation:none!important}}

.les{display:flex;flex-wrap:wrap;align-items:baseline;gap:1px 8px;margin:6px 6px 0;padding:8px 10px;border-radius:11px;background:var(--violet-soft);border-left:3px solid var(--violet);cursor:pointer;font-size:14px}
.les .lt{font-weight:800;color:var(--violet);font-variant-numeric:tabular-nums;font-size:12.5px}
.les .ln{font-weight:700;flex:1 1 100%}
.les .lp{font-size:12.5px;color:var(--muted)}
.les.past{opacity:.5}
.lesrow .les{margin:0 0 8px;font-size:15.5px;padding:11px 14px}
.lesrow .les .ln{flex:1 1 auto}
.dayadd{display:flex;gap:6px}
.lesadd{font-size:13px;font-weight:800;color:var(--violet);background:var(--violet-soft);border-radius:12px;padding:0 11px;white-space:nowrap}
.copybtn{font-size:13.5px;font-weight:800;color:var(--violet);background:var(--violet-soft);border-radius:12px;padding:10px 14px}
.sheettag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--violet);background:var(--violet-soft);padding:4px 10px;border-radius:99px;margin-bottom:10px}
input[type=time]{border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--bg)}
#auth{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
#auth[hidden],#app[hidden]{display:none}
.authbox{width:100%;max-width:400px;padding:32px 26px;text-align:center}
.alogo{width:58px;height:58px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;color:#fff;font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:var(--shadow)}
.authbox h2{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:500;font-size:32px;margin:0}
.authbox .sub{margin:4px 0 18px}
#authform{display:flex;flex-direction:column;gap:10px}
#authform input{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 16px;font-size:16px;outline:none;width:100%}
#authform input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#authform .btn{margin-top:4px;padding:15px}
#authform .btn:disabled{opacity:.6}
.aerr{color:var(--red);font-weight:700;font-size:14px;min-height:1.2em;text-align:left;padding:0 4px}
.aerr.ok{color:var(--accent)}
.alinks{display:flex;flex-direction:column;gap:4px;margin-top:16px}
.alinks button{color:var(--muted);font-size:14.5px;padding:7px}
.alinks b{color:var(--accent)}
.hright{display:flex;gap:8px;align-items:center}
.acct{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:15px;text-transform:uppercase}
.setup{max-width:520px;text-align:left;padding:28px}
.setup code{background:var(--bg);padding:2px 6px;border-radius:6px}
@media (max-width:820px){input,textarea{font-size:16px!important}}
@media (max-width:480px){.stxt{display:none}.sync{padding:9px}header h1{font-size:20px}}

/* v2: agenda's, thema's, instellingen */
.calbar{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px;margin:0 -2px;scrollbar-width:none}
.calbar::-webkit-scrollbar{display:none}
.calchip{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13.5px;white-space:nowrap}
.calchip i,.cdot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.calchip.off{opacity:.5}.calchip.off i{background:transparent!important;box-shadow:inset 0 0 0 2px var(--muted)}
.chip.cal{display:inline-flex;align-items:center;gap:5px}
.chip.cal i{width:8px;height:8px;border-radius:50%}
.les{--ec:var(--violet);background:color-mix(in srgb,var(--ec) 13%,var(--card));border-left:3px solid var(--ec)}
.les .lt{color:color-mix(in srgb,var(--ec) 70%,var(--ink))}
.les .kb{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:6px;background:color-mix(in srgb,var(--ec) 22%,transparent);color:color-mix(in srgb,var(--ec) 60%,var(--ink))}
.les.exam{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--red) 55%,transparent)}
.les.exam .kb{background:var(--red);color:#fff}
.les .rep{font-size:13px;color:var(--muted);font-weight:800}
.lesrow .les .lp{flex-basis:auto}

<script type="module">
import {firebaseConfig} from "./config.js";
// ---------- helpers ----------
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ds(new Date());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ds(d)};
const monday=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d)};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/86400000);

function occurs(e,d){
  if(!e.date)return false;
  if(!e.repeat||e.repeat==='none')return e.date===d;
  if(d<e.date||(e.until&&d>e.until)||(e.skip||[]).includes(d))return false;
  return diff(e.date,d)%(e.repeat==='biweekly'?14:7)===0;
}
const evOn=d=>events().filter(e=>occurs(e,d)).sort((a,b)=>(a.start||'')<(b.start||'')?-1:(a.start||'')>(b.start||'')?1:0);

function syncErr(e){console.error(e);S.mode='error';render()}
const locOf=t=>S.shared[t.cal]?t.cal:'me';
const itemCol=loc=>loc==='me'?F.collection(db,'users',USER.uid,'items'):F.collection(db,'calendars',loc,'items');
function clean(t){const {id,_loc,kind,...o}=t;for(const k in o)if(o[k]===undefined)delete o[k];return o}
function rebuild(){const t={};for(const loc in S.src){if(loc!=='me'&&!S.shared[loc])continue;for(const id in S.src[loc])t[id]=S.src[loc][id]}S.tasks=t}
function put(t){
  const loc=locOf(t),old=S.tasks[t.id];
  if(old&&old._loc&&old._loc!==loc){if(S.src[old._loc])delete S.src[old._loc][t.id];if(F&&USER)F.deleteDoc(F.doc(itemCol(old._loc),t.id)).catch(syncErr)}
  const nt={...t,_loc:loc};S.tasks[t.id]=nt;(S.src[loc]=S.src[loc]||{})[t.id]=nt;
  if(F&&USER)F.setDoc(F.doc(itemCol(loc),t.id),clean(nt)).catch(syncErr);
  render();
}
function upd(id,patch){const t=S.tasks[id];if(t)put({...t,...patch})}
function del(id){const t=S.tasks[id];if(!t)return;delete S.tasks[id];const loc=t._loc||'me';if(S.src[loc])delete S.src[loc][id];if(F&&USER)F.deleteDoc(F.doc(itemCol(loc),id)).catch(syncErr);render()}
function addTask(title,extra={}){

}

function stopListening(){unsubs.forEach(u=>{try{u()}catch(_){}});unsubs=[];for(const c in calUnsubs){try{calUnsubs[c]()}catch(_){}}calUnsubs={}}
function startListening(u){
  // eigen instellingen
  unsubs.push(F.onSnapshot(F.doc(db,'users',u.uid),snap=>{
    const d=snap.exists()?snap.data():null;
    if(!d){saveSettings();return}
    S.cats=(d.cats&&d.cats.length)?d.cats:DEFAULT_CATS.map(c=>({...c}));S.hidden=d.hidden||[];
    {const ds=defaultStudy(),x=d.study||{};S.study={tpl:x.tpl||ds.tpl,subjects:x.subjects||[],over:x.over||{}}}
    if(d.theme&&THEMES[d.theme]){S.theme=d.theme;lsSet('voila-theme',d.theme)}
    if(d.mode){S.dmode=d.mode;lsSet('voila-mode',d.mode)}
    applyTheme();render();
  },e=>console.warn('settings',e)));
  // eigen items
  unsubs.push(F.onSnapshot(itemCol('me'),{includeMetadataChanges:true},snap=>{
    const m={};snap.forEach(d=>{m[d.id]={...norm(d.data()),id:d.id,_loc:'me'}});
    S.src.me=m;rebuild();S.mode=snap.metadata&&snap.metadata.fromCache?'offline':'ok';render();refreshSheet();
  },syncErr));
  // gedeelde agenda's waar ik lid van ben
  unsubs.push(F.onSnapshot(F.query(F.collection(db,'calendars'),F.where('members','array-contains',u.uid)),snap=>{
    const now={};snap.forEach(d=>{now[d.id]={...d.data(),id:d.id}});
    for(const cid in calUnsubs)if(!now[cid]){calUnsubs[cid]();delete calUnsubs[cid];delete S.src[cid]}
    for(const cid in now)if(!calUnsubs[cid])calUnsubs[cid]=F.onSnapshot(itemCol(cid),s=>{const m={};s.forEach(d=>{m[d.id]={...norm(d.data()),id:d.id,_loc:cid}});S.src[cid]=m;rebuild();render();refreshSheet()},e=>console.warn('shared items',e));
    S.shared=now;rebuild();render();refreshSheet();
  },e=>console.warn('calendars',e)));
  // uitnodigingen voor mij
  unsubs.push(F.onSnapshot(F.query(F.collection(db,'calendars'),F.where('invites','array-contains',myEmail())),snap=>{
    const l=[];snap.forEach(d=>l.push({...d.data(),id:d.id}));S.invites=l;render();
  },e=>console.warn('invites',e)));
}

  <form id="authform" novalidate>
   <input type="email" id="a-mail" placeholder="E-mailadres" autocomplete="email" autocapitalize="off" required>

   ${m==='register'?`<input type="password" id="a-pw2" placeholder="Herhaal wachtwoord" autocomplete="new-password" required>`:''}
   <div class="aerr" id="a-err"></div>

function showAuth(){showScreen(authHTML());setTimeout(()=>{const e=document.getElementById('a-mail');if(!e)return;if(!e.value)e.value=lsGet('voila-mail','');const p=document.getElementById('a-pw');(e.value&&p?p:e).focus()},50)}
const AERR={'auth/invalid-email':'Dat e-mailadres klopt niet.','auth/missing-email':'Vul je e-mailadres in.','auth/invalid-credential':'E-mailadres of wachtwoord is fout.','auth/wrong-password':'E-mailadres of wachtwoord is fout.','auth/user-not-found':'E-mailadres of wachtwoord is fout.','auth/missing-password':'Vul je wachtwoord in.','auth/email-already-in-use':'Er bestaat al een account met dit e-mailadres. Meld je aan.','auth/weak-password':'Kies een wachtwoord van minstens 6 tekens.','auth/too-many-requests':'Te veel pogingen. Probeer het over een paar minuten opnieuw.','auth/network-request-failed':'Geen internetverbinding.','auth/operation-not-allowed':'Aanmelden met e-mail staat nog niet aan in Firebase (zie README, stap 3).'};
async function doAuth(){
  const m=S.authMode,err=document.getElementById('a-err'),btn=document.querySelector('#authform .btn');
  const mail=document.getElementById('a-mail').value.trim(),pw=(document.getElementById('a-pw')||{}).value,pw2=(document.getElementById('a-pw2')||{}).value;
  err.className='aerr';err.textContent='';
  if(m==='register'&&pw!==pw2){err.textContent='De wachtwoorden zijn niet hetzelfde.';return}
  btn.disabled=true;lsSet('voila-mail',mail);
  try{
    if(m==='login')await A.signInWithEmailAndPassword(auth,mail,pw);
    else if(m==='register')await A.createUserWithEmailAndPassword(auth,mail,pw);
    else{await A.sendPasswordResetEmail(auth,mail);err.className='aerr ok';err.textContent='Gelukt! Kijk in je mailbox (ook bij spam).'}
  }catch(e){err.textContent=AERR[e.code]||('Er ging iets mis ('+(e.code||e.message)+').')}
  btn.disabled=false;
}
async function init(){
  if(!firebaseConfig||!firebaseConfig.apiKey||/VUL/.test(firebaseConfig.apiKey)){showSetup();return}
  try{
    const [App,Auth,Fs]=await Promise.all([import(FB+'firebase-app.js'),import(FB+'firebase-auth.js'),import(FB+'firebase-firestore.js')]);
    const app=App.initializeApp(firebaseConfig);
    A=Auth;F=Fs;
    // Login bewaren op het toestel: eerst IndexedDB, anders localStorage (nodig voor iPhone-beginschermapps)
    try{auth=Auth.initializeAuth(app,{persistence:[Auth.indexedDBLocalPersistence,Auth.browserLocalPersistence]})}catch(e){auth=Auth.getAuth(app)}
    try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){db=F.getFirestore(app)}
    Auth.onAuthStateChanged(auth,u=>{
      stopListening();USER=u;S.tasks={};S.src={};S.shared={};S.invites=[];S.hidden=[];S.cats=DEFAULT_CATS.map(c=>({...c}));S.study=defaultStudy();
      if(!u){S.focusOpen=false;closeEdit();renderFocus();showAuth();return}
      S.authMode='login';S.mode='loading';showApp();render();
      startListening(u);
    });
  }catch(e){console.error(e);showScreen(`<div class="card setup"><h2 style="margin-top:0">Geen verbinding</h2><p>De app kon niet starten. Controleer je internet en herlaad de pagina.</p></div>`)}
}

function dlChip(dl){
  const d=diff(today(),dl);
  if(d<0)return `<span class="chip red">${-d} dag${-d>1?'en':''} te laat</span>`;
  if(d===0)return `<span class="chip red">deadline vandaag</span>`;
  if(d===1)return `<span class="chip orange">deadline morgen</span>`;
  if(d<=3)return `<span class="chip orange">deadline over ${d} dagen</span>`;
  return `<span class="chip">deadline ${shortDate(dl)}</span>`;
}

const HPX=52;
const toMin=t=>{const[a,b]=(t||'0:0').split(':').map(Number);return a*60+b};
function dayItems(d){
  const ex=timedOn(d);
  const base=dayStudyRows(d).filter(r=>r.s||!ex.some(e=>overlapsEx(r.b,e))).map(r=>{if(!r.s)return r;const c=ex.find(e=>overlapsEx(r.b,e));return c?{...r,clash:c}:r});
  return [...base,...ex.map(e=>({b:{start:e.start,end:exEnd(e)},ex:e}))];
}
function layoutItems(items){
  items.forEach(it=>{it.ts=toMin(it.b.start);it.te=Math.max(it.ts+15,toMin(it.b.end))});
  items.sort((a,b)=>a.ts-b.ts||b.te-a.te);
  const clusters=[];let cur=[],end=-1;
  items.forEach(it=>{if(cur.length&&it.ts>=end){clusters.push(cur);cur=[];end=-1}cur.push(it);end=Math.max(end,it.te)});
  if(cur.length)clusters.push(cur);
  clusters.forEach(cl=>{const cols=[];cl.forEach(it=>{let c=cols.findIndex(x=>x<=it.ts);if(c<0){c=cols.length;cols.push(0)}cols[c]=it.te;it.col=c});cl.forEach(it=>it.n=cols.length)});
  return items;
}

function studyWeekTable(start){
  const td=today(),days=[...Array(7)].map((_,i)=>addDays(start,i)),end=days[6];
  const sm=parse(start).getMonth()===parse(end).getMonth();
  const label=sm?`${parse(start).getDate()} – ${fmt(end,{day:'numeric',month:'long'})}`:`${fmt(start,{day:'numeric',month:'short'})} – ${fmt(end,{day:'numeric',month:'short'})}`;
  const items=days.map(d=>layoutItems(dayItems(d)));
  const flat=items.flat();
  const from=Math.max(0,Math.min(8,...flat.map(x=>Math.floor(x.ts/60)))),to=Math.min(24,Math.max(18,...flat.map(x=>Math.ceil(x.te/60))));
  const H=(to-from)*HPX;
  const wk=studyAll().filter(s=>s.date>=start&&s.date<=end),dn=wk.filter(s=>s.done);
  const hrs=m=>{const u=Math.floor(m/60),r=m%60;return u+'u'+(r?' '+r+'m':'')};
  const thisWeek=start===monday(td),A=all();
  let h=`<section class="sweek ${thisWeek?'cur':''}"><div class="sweekhead"><b>${thisWeek?'Deze week · ':''}${label}</b><span class="hint" style="margin:0">${wk.length?`<b>${dn.length}/${wk.length}</b> studieblokken · ${hrs(dn.reduce((a,x)=>a+minsOf(x.start,x.end),0))} van ${hrs(wk.reduce((a,x)=>a+minsOf(x.start,x.end),0))}`:'nog geen studieblokken gepland'}</span><button class="mini grey" data-act="copyweek" data-v="${start}" title="Losse lessen van vorige week overnemen">Kopieer lessen</button><button class="mini grey" data-act="scopy" data-v="${start}" title="Studieblokken van vorige week overnemen">Kopieer studieblokken</button></div>`;
  h+=`<div class="cal-wrap"><div class="cal">`;
  h+=`<div class="cl corner"></div>`+days.map(d=>dayHeadHtml(d,td)).join('');
  h+=`<div class="cl">Taken &amp; deadlines</div>`+days.map(d=>taskCellHtml(d,td,A)).join('');
  h+=`<div class="cl">Vak v/d dag</div>`+days.map(d=>dayPlanCellHtml(d,td)).join('');
  // uuras
  h+=`<div class="axis" style="height:${H}px">${[...Array(to-from)].map((_,i)=>`<span style="top:${i*HPX}px">${from+i}u</span>`).join('')}</div>`;
  days.forEach((d,i)=>{
    const nowLine=d===td?(()=>{const m=toMin(nowHM());return m>=from*60&&m<=to*60?`<div class="nowline" style="top:${(m-from*60)/60*HPX}px"></div>`:''})():'';
    h+=`<div class="dcol ${d===td?'today':''} ${d<td?'past':''}${fCls(d)}" style="height:${H}px;--hpx:${HPX}px${feestOf(d)?';--fc:'+feestOf(d).c:''}" data-act="gridnew" data-v="${d}" data-from="${from}">${nowLine}${items[i].map(it=>{
      const top=(it.ts-from*60)/60*HPX,hgt=Math.max(22,(it.te-it.ts)/60*HPX-3);
      return `<div class="cit ${hgt<44?'short':''}" style="top:${top}px;height:${hgt}px;left:calc(${it.col} * 100% / ${it.n});width:calc(100% / ${it.n})">${studyCell(d,[it],null)}</div>`}).join('')}</div>`;
  });
  return h+`</div></div></section>`;
}

    case 'snew':{const [d,s,en]=v.split('|');const dp=dayPlan(d),used=studyOn(d).map(x=>x.subject);const dsub=dp&&dp.subjects&&dp.subjects.length?(dp.subjects.find(x=>!used.includes(x))||dp.subjects[0]):null;openStudy({type:'study',date:d,start:s,end:en,subject:dsub?dsub:S.lastSubj&&S.study.subjects.some(x=>x.id===S.lastSubj)?S.lastSubj:(S.study.subjects[0]||{}).id||'',what:'',done:false,cal:'school'},true);return true}
    case 'sedit':{const t=S.tasks[id];if(t)openStudy({...t},false);return true}
    case 'sdone':{const t=S.tasks[id];if(!t)return true;const nd=!t.done;upd(id,{done:nd,doneAt:nd?Date.now():null});if(nd){const r=e.target.getBoundingClientRect();celebrate(r.left+r.width/2,r.top+r.height/2)}return true}
    case 'stimer':S.focusOpen=false;startTimer(Math.max(1,+v));if(pipOK())openPip();else{S.focusOpen=true;renderFocus()}toast('Timer loopt tot het einde van je blok');return true;
    case 'sssub':S.ss=readSS();S.ss.subject=v;renderStudySheet();return true;
    case 'ssdonet':S.ss=readSS();S.ss.done=!S.ss.done;renderStudySheet();return true;
    case 'sssave':{const s=readSS();if(!s.subject&&S.study.subjects.length){toast('Kies een vak');return true}if(!s.date||!s.start||!s.end||s.end<=s.start){toast('Controleer de uren');return true}
      S.lastSubj=s.subject;put({...s,type:'study',cal:'school',id:s.id||newId(),created:s.created||Date.now()});closeEdit();toast(S.ssNew?'Ingepland':'Opgeslagen');return true}
    case 'ssdel':if(!S.delArm){S.ss=readSS();S.delArm=true;renderStudySheet()}else{const i=S.ss.id;closeEdit();del(i);toast('Verwijderd')}return true;
    case 'subnew':{let back=null;if(v==='from'&&S.sheet==='study')back={kind:'ss',obj:readSS(),isNew:S.ssNew};else if(v==='from'&&S.sheet==='sday')back={kind:'sd',obj:{...S.sd}};openSubj({id:'',name:'',color:CAT_COLORS[S.study.subjects.length%CAT_COLORS.length],examDate:null},true,back);return true}
    case 'subedit':{const s=S.study.subjects.find(x=>x.id===id);if(s)openSubj(s,false);return true}
    case 'subcolor':syncSub();S.sub.color=v;renderSubjSheet();return true;
    case 'subsave':{syncSub();const s=S.sub,name=(s.name||'').trim();if(!name){document.getElementById('sub-name').focus();return true}
      let sid=s.id;if(S.subNew){sid='s'+newId();S.study.subjects=[...S.study.subjects,{id:sid,name,color:s.color,examDate:s.examDate||null}]}else S.study.subjects=S.study.subjects.map(x=>x.id===s.id?{...x,name,color:s.color,examDate:s.examDate||null}:x);
      saveStudy();const back=S.subBack,wasNew=S.subNew;if(back&&back.kind==='ss'){openStudy({...back.obj,subject:sid},back.isNew)}else if(back&&back.kind==='sd'){openSday(back.obj.date,[...back.obj.subjects,sid])}else{closeEdit()}render();toast(wasNew?'Vak toegevoegd':'Opgeslagen');return true}
    case 'subdel':if(!S.delArm){syncSub();S.delArm=true;renderSubjSheet()}else{S.study.subjects=S.study.subjects.filter(x=>x.id!==S.sub.id);saveStudy();closeEdit();render();toast('Vak verwijderd')}return true;
    case 'sidetog':S.side=!S.side;lsSet('voila-side',S.side?'1':'0');render();return true;
    case 'gridnew':{const r=b.getBoundingClientRect(),hr=Math.min(23,+b.dataset.from+Math.floor((e.clientY-r.top)/HPX));openEv({type:'event',title:'',ekind:'activiteit',cal:defaultCal(),date:v,start:pad(hr)+':00',end:pad(Math.min(23,hr+1))+':'+(hr+1>23?'59':'00'),place:'',repeat:'none',until:null,skip:[]},true);return true}
    case 'tnew':openTnew(v);return true;
    case 'tndl':S.tn.dl=v==='1';renderTnew();return true;
    case 'tnsave':{const i=document.getElementById('tn-title');let ti=i.value.trim();if(!ti){i.focus();return true}let imp=false;if(/!\s*$/.test(ti)){imp=true;ti=ti.replace(/!+\s*$/,'').trim()}
      const isDl=S.tn.dl;addTask(ti,isDl?{deadline:S.tn.date,important:imp}:{date:S.tn.date,important:imp});closeEdit();toast(isDl?'Deadline toegevoegd':'Taak toegevoegd');return true}
    case 'sday':openSday(v);return true;
    case 'sdsub':S.sd.subjects=S.sd.subjects.includes(v)?S.sd.subjects.filter(x=>x!==v):[...S.sd.subjects,v];renderSdaySheet();return true;
    case 'sdsave':saveSday();closeEdit();toast('Vak van de dag opgeslagen');return true;
    case 'sdclear':{const d=S.sd.date;closeEdit();del(sdId(d));toast('Gewist');return true}
    case 'sdfill':{const s=S.sd;saveSday();const free=freeBlocks(s.date);free.forEach((r,i)=>put({id:newId(),type:'study',date:s.date,start:r.b.start,end:r.b.end,subject:s.subjects[i%s.subjects.length],what:'',done:false,cal:'school',created:Date.now()+i}));closeEdit();toast(`${free.length} blok${free.length>1?'ken':''} ingepland`);return true}
    case 'blocksedit':openBlocks('tpl');return true;
    case 'dayblocks':openBlocks('day',v);return true;
    case 'blkwd':{syncBlocks();const err=blocksValid(S.bed.blocks);if(err){toast(err);return true}S.study.tpl={...S.study.tpl,[S.bed.wd]:sortBl(S.bed.blocks)};saveStudy();S.bed.wd=+v;S.bed.blocks=sortBl(S.study.tpl[+v]||[]).map(x=>({...x}));renderBlocksSheet();return true}
    case 'blkadd':{syncBlocks();const l=sortBl(S.bed.blocks).slice(-1)[0];let st='09:00',en='10:30';if(l&&l.end){const [hh,mm]=l.end.split(':').map(Number);const a=hh*60+mm+15,z=a+90;if(z<24*60){st=pad(Math.floor(a/60))+':'+pad(a%60);en=pad(Math.floor(z/60))+':'+pad(z%60)}}S.bed.blocks.push({start:st,end:en});renderBlocksSheet();return true}
    case 'blkdel':syncBlocks();S.bed.blocks.splice(+b.dataset.i,1);renderBlocksSheet();return true;
    case 'blkcopy':{syncBlocks();const err=blocksValid(S.bed.blocks);if(err){toast(err);return true}const bl=sortBl(S.bed.blocks);const t={...S.study.tpl};for(let i=0;i<5;i++)t[i]=bl.map(x=>({...x}));S.study.tpl=t;saveStudy();toast('Gekopieerd naar maandag t.e.m. vrijdag');return true}
    case 'blkreset':{const o={...S.study.over};delete o[S.bed.date];S.study.over=o;saveStudy();closeEdit();render();toast('Standaarduren hersteld');return true}
    case 'blksave':{syncBlocks();const err=blocksValid(S.bed.blocks);if(err){toast(err);return true}const bl=sortBl(S.bed.blocks);
      if(S.bed.mode==='tpl')S.study.tpl={...S.study.tpl,[S.bed.wd]:bl};
      else{const o={...S.study.over};// oude aangepaste dagen opruimen
        const cut=addDays(today(),-30);for(const k in o)if(k<cut)delete o[k];o[S.bed.date]=bl;S.study.over=o}
      saveStudy();closeEdit();render();toast('Studieblokken opgeslagen');return true}
    case 'scopy':{const st=v,prev=addDays(st,-7);let n=0;studyAll().filter(s=>s.date>=prev&&s.date<st).forEach(s=>{const nd=addDays(s.date,7);if(!studyOn(nd).some(x=>x.start===s.start)){const {id,_loc,doneAt,...o}=s;put({...o,id:newId(),date:nd,done:false,created:Date.now()});n++}});toast(n?`${n} blok${n>1?'ken':''} gekopieerd`:'Niets te kopiëren');return true}
  }
  return false;
}

const VIEWFN={planning:vStudie,vandaag:vVandaag,week:vWeek,deadlines:vDeadlines,inbox:vInbox,instellingen:vInstellingen};

function render(){

     <nav><div class="in">${tab('vandaag',ICON.sun,'Vandaag',late)}${tab('planning',ICON.cal,'Planning')}${tab('deadlines',ICON.clock,'Deadlines',dlSoon)}${tab('inbox',ICON.tray,'Hoofd leeg')}</div></nav>`;

  if(!t||t.done||t.date!==td){t=all().filter(x=>x.date===td&&!x.done).sort(sortT)[0];S.focusId=t?t.id:null}

}

   ${tm}
   <div class="factions"><button class="btn" data-act="fdone">✓ Klaar!</button>
   <div class="fsmall"><button class="mini grey" data-act="fskip">Straks (volgende taak)</button><button class="mini grey" data-act="fsplit">Te groot? Hak op in stapjes</button></div>${pipOK()?`<button class="mini" data-act="pip" style="margin-top:4px">${PIP?'Mini-venster staat open':'Mini-venster in de hoek (blijft bovenaan)'}</button>`:''}</div>`;
  tick();
}
let actx=null;
function beep(){try{if(!actx)return;[0,0.35,0.7].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.18,actx.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d+.3);o.connect(g).connect(actx.destination);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.3)})}catch(e){}}
function startTimer(m){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}S.timer={end:Date.now()+m*6e4,total:m*6e4};clearInterval(S.tInt);S.tInt=setInterval(tick,1000);renderFocus()}
function stopTimer(){S.timer=null;clearInterval(S.tInt)}
function tick(){
  if(!S.timer)return;const left=S.timer.end-Date.now();
  if(left<=0){stopTimer();beep();toast('Tijd is om. Goed gewerkt — even pauze?');S.pipMsg='Tijd is om. Goed gewerkt — even pauze?';renderFocus();renderPip();return}
  const e=document.getElementById('tmr'),c=document.getElementById('ringc');
  if(e){const s=Math.ceil(left/1000);e.textContent=Math.floor(s/60)+':'+pad(s%60)}
  if(c)c.setAttribute('stroke-dashoffset',String(402.1*(1-left/S.timer.total)));
  const pe=PIP&&PIP.document.getElementById('pip-tmr');if(pe){const s=Math.ceil(left/1000);pe.textContent=Math.floor(s/60)+':'+pad(s%60)}
}


// ---------- mini-venster (blijft bovenaan, laptop) ----------
let PIP=null;
const pipOK=()=>'documentPictureInPicture' in window;
async function openPip(){
  if(!pipOK()){toast('Je browser ondersteunt dit niet. Gebruik Edge of Chrome op je laptop.');return}
  if(PIP){try{PIP.focus()}catch(_){}return}
  try{
    const w=await documentPictureInPicture.requestWindow({width:340,height:460});
    PIP=w;
    [...document.styleSheets].forEach(ss=>{try{const st=w.document.createElement('style');st.textContent=[...ss.cssRules].map(r=>r.cssText).join('\n');w.document.head.appendChild(st)}catch(_){if(ss.href){const l=w.document.createElement('link');l.rel='stylesheet';l.href=ss.href;w.document.head.appendChild(l)}}});
    w.document.title='Voilà — nu bezig';
    w.document.body.className='pipbody';
    w.document.addEventListener('click',pipClick);
    w.addEventListener('pagehide',()=>{PIP=null;render()});
    renderPip();render();
  }catch(e){console.error(e);toast('Mini-venster openen lukte niet')}
}
function renderPip(){
  if(!PIP)return;
  const d=PIP.document;d.documentElement.setAttribute('style',document.documentElement.getAttribute('style')||'');
  const t=pickFocus(),left=all().filter(x=>x.date===today()&&!x.done).length;
  let h;
  if(!t)h=`<div class="pip"><div class="flabel">Voilà</div><div class="piptitle">Alles van vandaag is klaar!</div><p class="hint">Neem een pauze. Je hebt het verdiend.</p><button class="mini grey" data-act="pipclose">Venster sluiten</button></div>`;
  else{
    const st=t.steps||[],nd=st.findIndex(s=>!s.done),dn=st.filter(s=>s.done).length;
    const tm=S.timer?`<div class="piptimer"><b id="pip-tmr">--:--</b><button class="mini grey" data-act="tstop">Stop</button></div>`:`<div class="pipbtns">${[5,15,25].map(m=>`<button class="mini" data-act="timer" data-v="${m}">${m} min</button>`).join('')}</div>`;
    h=`<div class="pip">
      <div class="piphead"><span class="flabel">Nu bezig</span><span class="hint" style="margin:0">nog ${left} vandaag</span></div>
      <div class="piptitle">${t.important?'★ ':''}${esc(t.title)}</div>
      ${S.pipMsg?`<div class="box soft" style="margin:0">${esc(S.pipMsg)}</div>`:''}
      ${st.length?`<div class="pipprog"><div class="bar"><i style="width:${Math.round(dn/st.length*100)}%"></i></div><span>${dn}/${st.length}</span></div>
        <div class="pipsteps">${st.map((s,i)=>`<div class="step ${s.done?'done':''} ${i===nd?'next':''}"><button class="check" data-act="step" data-id="${t.id}" data-i="${i}">${s.done?'✓':''}</button><span>${esc(s.t)}</span></div>`).join('')}</div>`
      :`<p class="hint" style="margin:0">Geen stapjes. Tip: hak de taak op in de app (Focusmodus → "Te groot?").</p>`}
      ${tm}
      <div class="pipfoot"><button class="btn" data-act="pipdone">✓ Klaar</button><button class="btn ghost" data-act="pipnext">Volgende</button></div>
    </div>`;
  }
  d.body.innerHTML=h;
  tick();
}
function pipClick(e){
  const b=e.target.closest('[data-act]');if(!b)return;
  const v=b.dataset.v,id=b.dataset.id;S.pipMsg=null;
  switch(b.dataset.act){
    case 'step':{const t=S.tasks[id];if(!t)return;const st=(t.steps||[]).map((s,i)=>i===+b.dataset.i?{...s,done:!s.done}:s);upd(id,{steps:st});if(st.every(s=>s.done))S.pipMsg='Alle stapjes gedaan! Tik op ✓ Klaar.';break}
    case 'pipdone':{const t=pickFocus();if(t){upd(t.id,{done:true,doneAt:Date.now()});stopTimer();S.focusId=null;S.pipMsg=CHEERS[Math.floor(Math.random()*CHEERS.length)]}break}
    case 'pipnext':{const t=pickFocus();if(t){upd(t.id,{order:Date.now()});const nx=all().filter(x=>x.date===today()&&!x.done&&x.id!==t.id).sort(sortT)[0];S.focusId=nx?nx.id:t.id;stopTimer()}break}
    case 'timer':startTimer(+v);break;
    case 'tstop':stopTimer();break;
    case 'pipclose':try{PIP.close()}catch(_){}return;
  }
  renderPip();if(S.focusOpen)renderFocus();
}

// ---------- feedback ----------
let tTo;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tTo);tTo=setTimeout(()=>t.classList.remove('show'),2600)}
function celebrate(x,y){
  toast(CHEERS[Math.floor(Math.random()*CHEERS.length)]);
  const em=['var(--accent)','var(--accent2)','var(--violet)','var(--imp)'];
  for(let i=0;i<10;i++){const s=document.createElement('span');s.className='conf';s.style.background=em[i%em.length];s.style.left=x+'px';s.style.top=y+'px';
    const a=Math.random()*Math.PI*2,r=60+Math.random()*90;s.style.setProperty('--dx',Math.cos(a)*r+'px');s.style.setProperty('--dy',Math.sin(a)*r-40+'px');s.style.setProperty('--r',(Math.random()*360)+'deg');
    document.body.appendChild(s);setTimeout(()=>s.remove(),1200)}
}
function toggle(id,ev){const t=S.tasks[id];if(!t)return;const nd=!t.done;upd(id,{done:nd,doneAt:nd?Date.now():null});if(nd){const r=ev&&ev.target.getBoundingClientRect?ev.target.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};celebrate(r.left+r.width/2,r.top+r.height/2)}}
function quickAdd(input){
  let v=input.value.trim();if(!v)return;let imp=false;
  if(/!\s*$/.test(v)){imp=true;v=v.replace(/!+\s*$/,'').trim()}
  const d=input.dataset.addDate;input.value='';
  addTask(v,{date:d||null,important:imp});
}
const okMail=m=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m);
function calMsg(t,ok){S.calMsg={t,ok};const m=document.getElementById('cal-msg');if(m){m.className='aerr'+(ok?' ok':'');m.textContent=t}}

// ---------- klikken ----------
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');
  if(!b){if(e.target.id==='sheetwrap')closeEdit();return}
  // knoppen binnen een klikbare rij niet dubbel laten afgaan
  e.stopPropagation();
  const id=b.dataset.id,v=b.dataset.v,td=today();
  if(await studyClick(b.dataset.act,b,e))return;
  switch(b.dataset.act){
    case 'view':location.hash=v;break;
    case 'amode':S.authMode=v;showAuth();break;
    case 'logout':closeEdit();A.signOut(auth);break;
    case 'pwreset':A.sendPasswordResetEmail(auth,USER.email).then(()=>{const m=document.getElementById('acct-msg');m.className='aerr ok';m.textContent='Link verstuurd naar je mailbox.'}).catch(er=>{document.getElementById('acct-msg').textContent=AERR[er.code]||'Lukt niet, probeer later opnieuw.'});break;
    case 'toggle':toggle(id,e);break;
    case 'star':upd(id,{important:!S.tasks[id].important});break;
    case 'edit':case 'plan':openEdit(id);break;
    case 'addbtn':{const i=document.getElementById(b.dataset.for);quickAdd(i);i.focus();break}
    case 'totoday':upd(id,{date:td});toast('Naar vandaag gezet');break;
    case 'tomorrow':upd(id,{date:addDays(td,1)});toast('Staat op morgen');break;
    case 'toinbox':upd(id,{date:null});toast('Bij "nog in te plannen" gezet');break;
    case 'alltoday':all().filter(t=>!t.done&&t.date&&t.date<td).forEach(t=>upd(t.id,{date:td}));break;
    case 'showdone':S.showDone=!S.showDone;render();break;
    case 'wprev':S.week--;render();break;case 'wnext':S.week++;render();break;case 'wnow':S.week=0;render();break;
    case 'dladd':{const ti=document.getElementById('dl-title'),dd=document.getElementById('dl-date').value;if(!ti.value.trim()){ti.focus();return}addTask(ti.value,{deadline:dd||null});ti.value='';toast('Deadline toegevoegd');break}
    case 'dump':{const ta=document.getElementById('dump');const lines=ta.value.split('\n').map(s=>s.replace(/^[-*•\s]+/,'').trim()).filter(Boolean);lines.forEach((l,i)=>addTask(l,{order:Date.now()+i,created:Date.now()+i}));ta.value='';if(lines.length)toast(`${lines.length} ding${lines.length>1?'en':''} uit je hoofd`);break}
    case 'focus':S.focusOpen=true;S.focusId=null;renderFocus();break;
    case 'fclose':S.focusOpen=false;stopTimer();renderFocus();break;
    case 'fdone':{const t=pickFocus();if(t){toggle(t.id,e);stopTimer();S.focusId=null;renderFocus()}break}
    case 'fskip':{const t=pickFocus();if(t){S.focusId=null;upd(t.id,{order:Date.now()});const nx=all().filter(x=>x.date===td&&!x.done&&x.id!==t.id).sort(sortT)[0];S.focusId=nx?nx.id:t.id;stopTimer();renderFocus()}break}
    case 'fsplit':{const t=pickFocus();if(t){openEdit(t.id);setTimeout(()=>{const s=document.getElementById('e-step');s&&s.focus()},50)}break}
    case 'timer':startTimer(+v);break;
    case 'tstop':stopTimer();renderFocus();break;
    case 'pip':openPip();break;
    case 'step':{const t=S.tasks[id];const st=(t.steps||[]).map((s,i)=>i===+b.dataset.i?{...s,done:!s.done}:s);upd(id,{steps:st});if(st[+b.dataset.i].done)toast('Stapje gezet');if(S.editId)renderSheet();break}
    // taak-blad
    case 'setdate':upd(S.editId,{date:v||null});renderSheet();break;
    case 'setcal':upd(S.editId,{cal:v});renderSheet();break;
    case 'cleardl':upd(S.editId,{deadline:null});renderSheet();break;
    case 'eimp':upd(S.editId,{important:!S.tasks[S.editId].important});renderSheet();break;
    case 'est':{const t=S.tasks[S.editId];upd(S.editId,{est:+t.est===+v?null:+v});renderSheet();break}
    case 'stepdel':{const t=S.tasks[S.editId];upd(t.id,{steps:(t.steps||[]).filter((_,i)=>i!==+b.dataset.i)});renderSheet();break}
    case 'del':if(!S.delArm){S.delArm=true;renderSheet()}else{const i=S.editId;S.editId=null;closeEdit();del(i);toast('Verwijderd')}break;
    case 'sheetclose':closeEdit();break;
    // activiteiten
    case 'newev':{const cs=allCals();const sc=cs.find(c=>c.id==='school'&&!S.hidden.includes('school'));openEv({type:'event',title:'',ekind:'activiteit',cal:defaultCal(),date:v,start:'',end:'',place:'',repeat:'none',until:null,skip:[]},true);break}
    case 'editev':{const t=S.tasks[id];if(t)openEv({...t,type:'event',ekind:t.ekind||(t.kind==='les'?'les':'activiteit'),cal:t.cal||(t.kind==='les'?'school':'prive')},false,v);break}
    case 'evkind':{S.ev=readEv();S.ev.ekind=v;if(S.evNew&&(v==='les'||v==='examen')&&S.cats.some(c=>c.id==='school'))S.ev.cal='school';renderEvSheet();break}
    case 'evcal':S.ev=readEv();S.ev.cal=v;renderEvSheet();break;
    case 'evrep':S.ev=readEv();S.ev.repeat=v;renderEvSheet();break;
    case 'evsave':{const ev=readEv();if(!ev.title){document.getElementById('ev-title').focus();return}if(!ev.date){document.getElementById('ev-date').focus();return}
      put({...ev,type:'event',id:ev.id||newId(),created:ev.created||Date.now()});closeEdit();toast(S.evNew?'Toegevoegd aan je agenda':'Opgeslagen');break}
    case 'evskip':{const ev=readEv();put({...ev,skip:[...(ev.skip||[]),S.evOcc]});closeEdit();toast('Deze keer overgeslagen');break}
    case 'evcopy':{const ev=readEv();if(!ev.title)return;put(ev);S.ev=ev;const nd=addDays(ev.date,+v);if(evDup(ev,nd))toast('Die staat er al');else{put({...ev,id:newId(),date:nd,created:Date.now()});toast('Gekopieerd naar '+shortDate(nd))}break}
    case 'evdel':if(!S.delArm){S.delArm=true;S.ev=readEv();renderEvSheet()}else{const i=S.ev.id;closeEdit();del(i);toast('Verwijderd')}break;
    case 'copyweek':{const st=v,prev=addDays(st,-7);let n=0;Object.values(S.tasks).filter(x=>isEv(x)&&(x.ekind==='les'||x.kind==='les')&&(!x.repeat||x.repeat==='none')&&x.date>=prev&&x.date<st).forEach(l=>{const nd=addDays(l.date,7);if(!evDup(l,nd)){const {id,_loc,...o}=norm(l);put({...o,id:newId(),date:nd,created:Date.now()});n++}});toast(n?`${n} les${n>1?'sen':''} gekopieerd`:'Niets te kopiëren — vorige week had geen (nieuwe) losse lessen');break}
    // agenda's
    case 'calvis':S.hidden=S.hidden.includes(v)?S.hidden.filter(x=>x!==v):[...S.hidden,v];saveSettings();render();break;
    case 'theme':S.theme=v;lsSet('voila-theme',v);applyTheme();saveSettings();render();break;
    case 'dmode':S.dmode=v;lsSet('voila-mode',v);applyTheme();saveSettings();render();break;
    case 'newcat':openCal({new:true,shared:false,name:'',color:CAT_COLORS[(S.cats.length)%CAT_COLORS.length]});break;
    case 'editcat':{const c=S.cats.find(x=>x.id===id);if(c)openCal({...c,shared:false});break}
    case 'newshared':openCal({new:true,shared:true,name:'',color:CAT_COLORS[4]});break;
    case 'editshared':{const c=S.shared[id];if(c)openCal({...c,shared:true});break}
    case 'calcolor':syncCalName();S.editCal.color=v;renderCalSheet();break;
    case 'calsave':{syncCalName();const c=S.editCal,name=(c.name||'').trim();if(!name){document.getElementById('cal-name').focus();return}
      try{
        if(c.shared&&c.new){b.disabled=true;const cid=await createShared(name,c.color);toast('Gedeelde agenda gemaakt');const fresh=S.shared[cid];openCal(fresh?{...fresh,shared:true}:{id:cid,name,color:c.color,shared:true,owner:USER.uid,memberEmails:{[USER.uid]:myEmail()},invites:[],members:[USER.uid]});setTimeout(()=>{const x=document.getElementById('cal-invite');x&&x.focus()},80);return}
        if(c.shared){await F.updateDoc(calRef(c.id),{name,color:c.color});toast('Opgeslagen')}
        else if(c.new){S.cats=[...S.cats,{id:'c'+newId(),name,color:c.color}];saveSettings();toast('Agenda toegevoegd')}
        else{S.cats=S.cats.map(x=>x.id===c.id?{...x,name,color:c.color}:x);saveSettings();toast('Opgeslagen')}
      }catch(er){console.error(er);toast('Dat lukte niet. Probeer opnieuw.');b.disabled=false;return}
      closeEdit();render();break}
    case 'caldel':{const c=S.editCal;if(!S.delArm){syncCalName();S.delArm=true;renderCalSheet();return}
      try{
        if(!c.shared){Object.values(S.src.me||{}).filter(t=>t.cal===c.id).forEach(t=>put({...t,cal:'prive'}));S.cats=S.cats.filter(x=>x.id!==c.id);S.hidden=S.hidden.filter(x=>x!==c.id);saveSettings();toast('Agenda verwijderd')}
        else if(c.owner===USER.uid){const items=Object.keys(S.src[c.id]||{});await Promise.all(items.map(i=>F.deleteDoc(F.doc(itemCol(c.id),i))));await F.deleteDoc(calRef(c.id));toast('Gedeelde agenda verwijderd')}
        else{await F.updateDoc(calRef(c.id),{members:F.arrayRemove(USER.uid),['memberEmails.'+USER.uid]:F.deleteField()});toast('Je hebt de agenda verlaten')}
      }catch(er){console.error(er);toast('Dat lukte niet. Probeer opnieuw.');return}
      closeEdit();render();break}
    case 'calinvite':{const inp=document.getElementById('cal-invite'),m=inp.value.trim().toLowerCase(),c=S.editCal;
      if(!okMail(m)){calMsg('Vul een geldig e-mailadres in.');inp.focus();return}
      if(m===myEmail()){calMsg('Dat is je eigen e-mailadres.');return}
      if(Object.values(c.memberEmails||{}).includes(m)){calMsg('Die persoon is al lid.');return}
      try{await F.updateDoc(calRef(c.id),{invites:F.arrayUnion(m)});inp.value='';calMsg('Uitnodiging verstuurd naar '+m+'.',true)}catch(er){console.error(er);calMsg('Uitnodigen lukte niet. Probeer opnieuw.')}
      break}
    case 'caluninvite':try{await F.updateDoc(calRef(S.editCal.id),{invites:F.arrayRemove(v)})}catch(er){console.error(er)}break;
    case 'calkick':try{await F.updateDoc(calRef(S.editCal.id),{members:F.arrayRemove(v),['memberEmails.'+v]:F.deleteField()})}catch(er){console.error(er)}break;
    case 'accept':try{await F.updateDoc(calRef(id),{members:F.arrayUnion(USER.uid),invites:F.arrayRemove(myEmail()),['memberEmails.'+USER.uid]:myEmail()});toast('Je bent lid van de gedeelde agenda')}catch(er){console.error(er);toast('Accepteren lukte niet.')}break;
    case 'decline':try{await F.updateDoc(calRef(id),{invites:F.arrayRemove(myEmail())});toast('Uitnodiging geweigerd')}catch(er){console.error(er)}break;
  }
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key==='Escape'){if(S.sheet)closeEdit();else if(S.focusOpen){S.focusOpen=false;stopTimer();renderFocus()}return}
  if(e.key!=='Enter'||e.isComposing)return;
  if(t.dataset&&t.dataset.addDate!==undefined){e.preventDefault();quickAdd(t)}
  else if(t.id==='dl-title'){e.preventDefault();document.querySelector('[data-act="dladd"]').click()}
  else if(t.id==='e-step'){e.preventDefault();const v=t.value.trim();if(!v)return;const k=S.tasks[S.editId];t.value='';upd(k.id,{steps:[...(k.steps||[]),{t:v,done:false}]});renderSheet();document.getElementById('e-step').focus()}
  else if(t.id==='e-title'){e.preventDefault();saveTitle(t.value);t.blur()}
  else if(t.id&&t.id.startsWith('ev-')){e.preventDefault();document.querySelector('[data-act="evsave"]').click()}
  else if(t.id==='cal-invite'){e.preventDefault();document.querySelector('[data-act="calinvite"]').click()}
  else if(t.id==='ss-what'||t.id==='ss-start'||t.id==='ss-end'){e.preventDefault();document.querySelector('[data-act="sssave"]').click()}
  else if(t.id==='tn-title'){e.preventDefault();document.querySelector('[data-act="tnsave"]').click()}
  else if(t.id==='sub-name'){e.preventDefault();document.querySelector('[data-act="subsave"]').click()}
  else if(t.id==='cal-name'){e.preventDefault();document.querySelector('[data-act="calsave"]').click()}
});
document.addEventListener('submit',e=>{if(e.target.id==='authform'){e.preventDefault();doAuth()}});
document.addEventListener('change',e=>{
  const t=e.target;if(!S.editId)return;
  if(t.id==='e-title')saveTitle(t.value);
  if(t.id==='e-date'){upd(S.editId,{date:t.value||null});renderSheet()}
  if(t.id==='e-dl'){upd(S.editId,{deadline:t.value||null});renderSheet()}
});
function fromHash(){let h=location.hash.slice(1);if(h==='week'||h==='studie')h='planning';S.view=VIEWS.includes(h)?h:'vandaag';render();scrollTo(0,0)}
window.addEventListener('hashchange',fromHash);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
fromHash();init();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
